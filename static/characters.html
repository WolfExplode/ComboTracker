<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WuWa Characters</title>
    <link rel="stylesheet" href="characters.css">
</head>

<body>
    <!-- Every character's moves (encore.moe) and community team rotations (AntoCrasher's calc compilation). -->
    <header class="topbar">
        <a href="index.html" class="back" title="Back to the combo tracker">&larr; Combo Tracker</a>
        <h1>Characters</h1>
        <input type="search" id="search" placeholder="Search characters" autocomplete="off">
        <div id="elementFilter" class="chips" role="group" aria-label="Filter by element"></div>
        <button type="button" id="refreshBtn" class="subtle" title="Download fresh data from encore.moe and the rotation sheet">Refresh data</button>
    </header>

    <div id="notice" class="notice hidden" role="status"></div>

    <main class="layout">
        <nav id="roster" class="roster" aria-label="Characters"></nav>

        <section id="detail" class="detail">
            <div class="empty">Pick a character to see their moves and team rotations.</div>
        </section>
    </main>

    <script src="ww_rotations.js"></script>
    <script src="characters.js"></script>
</body>

</html>
